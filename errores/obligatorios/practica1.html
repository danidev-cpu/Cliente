<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Practica 1</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <h1>Numero de visitas:</h1>
        <p id="visitas"></p>
        <script>
            let visitas = document.getElementById("visitas");

            document.addEventListener("DOMContentLoaded", function () {
                let cookie = getCookie("visitas");
                if (cookie == "") {
                    setCookie("visitas", 1, 30);
                } else {
                    setCookie("visitas", ++cookie, 30);
                }
                visitas.textContent = cookie;
            });

            function setCookie(nombre, valor, exdays) {
                const date = new Date();
                date.setTime(date.getTime() + exdays * 24 * 60 * 60 * 1000);
                const expires = `expires=${date.toUTCString()}`;
                document.cookie = `${nombre}=${valor}; ${expires}; path=/`;
            }

            function getCookie(cname) {
                var name = cname + "=";
                var ca = document.cookie.split(";");
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i].trim();
                    if (c.indexOf(name) == 0) {
                        return c.substring(name.length, c.length);
                    }
                }
                return "";
            }
        </script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
            defer
        ></script>
    </body>
</html>
